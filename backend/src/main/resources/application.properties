spring.application.name=pokemon-api

# --- Database -------------------------------------------------------------------------------------
# Defaults match docker-compose.yml for local development. They are DEMO-ONLY values; override them with
# environment variables (see .env.example). The schema is owned by Flyway (ADR-004).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pokemon}
spring.datasource.username=${DB_USERNAME:pokemon}
spring.datasource.password=${DB_PASSWORD:pokemon}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Runtime --------------------------------------------------------------------------------------
spring.threads.virtual.enabled=true

# --- Operations -----------------------------------------------------------------------------------
# Only health and info are exposed over HTTP. Health lists its components (db, disk...) with their status
# so Docker and the reviewer can see the database is reachable, but never their details (versions, paths).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# --- JSON ---------------------------------------------------------------------------------------
# Our API is strict: an unknown field in a request body is a 400 (e.g. trying to edit a read-only catalogue
# field). PokeAPI's response records opt out explicitly with @JsonIgnoreProperties(ignoreUnknown = true).
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Errors ---------------------------------------------------------------------------------------
server.error.include-stacktrace=never
