# nginx for the production build (frontend/Dockerfile).
# - serves the static bundle, falling back to index.html for client-side routes (/pokedex/133, /collection...)
# - proxies /api to the backend container, so the browser only ever talks to this origin (no CORS)

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Security headers are set per static location below (an add_header inside a location replaces the
    # server-level ones). /api responses keep the headers Spring Security already sends.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Resolving through a variable at request time (instead of once at startup) means
    # nginx keeps working when the backend container is recreated with a new IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A list page fans out to PokeAPI on a cold cache; leave headroom over the backend's own timeouts.
        proxy_read_timeout 30s;
    }

    # Vite fingerprints everything under /assets (content hash in the file name): cache it forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routes: unknown paths get the app shell; React Router renders the page (or its own 404).
    # index.html itself is never cached, so a new deploy is picked up on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
