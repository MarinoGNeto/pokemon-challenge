spring:
  application:
    name: task-api
  datasource:
    url: jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  error:
    include-stacktrace: never

app:
  jwt:
    # DEV ONLY. Override with the APP_JWT_SECRET environment variable (>= 32 bytes) everywhere else.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: task-api
    ttl: 1h
